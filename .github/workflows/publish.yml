name: publish

# All npm-publishing flows live in this single file. npm's trusted-publisher
# config for every `@stacks/*` package points at `publish.yml` — renaming this
# file requires updating that config on npmjs.com per package.
#
# The "chore: version packages" PR itself is opened/updated by `version.yml`;
# that workflow never publishes. Only this file publishes to npm.
#
# Triggers (the `target` dispatch input is classified by `validate-dispatch`):
#
#   release   — auto on push to main where the head commit is "chore: version
#               packages" (i.e. the version PR was just merged), OR
#               workflow_dispatch from main with `target` empty.
#               Publishes the bumped packages to npm under `latest`, pushes
#               per-package git tags, and creates a GitHub Release per package.
#               `changeset publish` only publishes versions that aren't already
#               on npm (npm itself forbids overwriting), so a manual dispatch
#               here is safe to re-run when a previous release left some
#               packages unpublished — it'll fill the gaps and no-op for the
#               rest.
#
#   snapshot  — workflow_dispatch with `target=main` (publishes from main as
#               the `@beta` dist-tag, by convention) or `target=<word>`
#               (publishes from branch `<word>` as the `@<word>` dist-tag).
#               Versions look like `<next-release>-<tag>.<N>` where `<tag>`
#               is the dist-tag and `<N>` is a per-tag counter queried from
#               npm. Use for ad-hoc previews from a long-lived release branch
#               (e.g. `next`).
#
#   pr        — workflow_dispatch with `target=<PR number>`.
#               Publishes a `@pr` canary built from that PR's head commit.
#               Versions look like `<next-release>-pr.<PR#>.<N>`.
#               Sticky-header'd into the PR description so reviewers can
#               install the canary. PRs from forks are refused.
#
# The publish jobs use the `npm` environment. npm and the repository settings
# can then permit a publish only from `main`. Without this, a dispatch from a
# different branch can run a changed copy of this file.
#
# The `is-not-fork` gate from `pre-run` only stops runs in forked
# repositories. It does not examine the source of a PR.

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**.md'

  workflow_dispatch:
    inputs:
      target:
        description: |
          What to publish.
          empty           — production release to `latest` (only valid from main)
          main            — `@beta` snapshot from main
          <word>          — `@<word>` snapshot from branch `<word>` (lowercase letters/digits, must start with a letter)
          <PR number>     — `@pr` canary for that PR
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  pre-run:
    uses: ./.github/workflows/pre-run.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write # cancel-previous-runs

  # Classify the dispatch `target` input into a `kind`:
  #   release  — empty target (manual production publish)
  #   pr       — positive integer (PR canary)
  #   snapshot — lowercase word (`main`, `next`, etc. — published as @<word>,
  #              with `main` re-mapped to the `@beta` dist-tag)
  # Anything else fails the workflow up front so a publish job never starts
  # against a typo'd target.
  #
  # This job runs no code from the target. Thus the other jobs can trust its
  # outputs.
  validate-dispatch:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      pull-requests: read # resolve the PR head
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      ref: ${{ steps.classify.outputs.ref }}
      tag: ${{ steps.classify.outputs.tag }}
      suffix: ${{ steps.classify.outputs.suffix }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          # `pr` and `latest` are reserved dist-tags managed by other code paths
          # (PR canaries, and the `release` flow respectively); reject them as
          # snapshot targets so a typo can't bypass those flows.
          #
          # `[[ =~ ]]` examines the full input. `grep` examines each line, and
          # an input with more than one line can then add its own outputs.
          if [ -z "$TARGET" ]; then
            kind=release
          elif [[ "$TARGET" =~ ^[1-9][0-9]*$ ]]; then
            kind=pr
          elif [ "$TARGET" = "pr" ] || [ "$TARGET" = "latest" ]; then
            echo "::error::target '$TARGET' is a reserved dist-tag; use a PR number for a pr canary, or merge the version PR for a latest release"
            exit 1
          elif [[ "$TARGET" =~ ^[a-z][a-z0-9]*$ ]]; then
            kind=snapshot
          else
            echo "::error::target must be empty, a positive PR number, or a single-word lowercase branch name (e.g. 'next'); got '$TARGET'"
            exit 1
          fi
          if [ "$kind" = "release" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::release dispatch (empty target) must run from main; current ref is '$GITHUB_REF_NAME'"
            exit 1
          fi
          if [ "$kind" = "pr" ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET")
            head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
            if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::PR #$TARGET comes from '$head_repo'; canaries are only published for branches in $GITHUB_REPOSITORY"
              exit 1
            fi
            # Use the head SHA. A later push cannot then change the build.
            ref=$(jq -r '.head.sha' <<<"$pr")
            tag=pr
            suffix="pr.$TARGET"
          elif [ "$kind" = "snapshot" ]; then
            ref=$TARGET
            tag=$TARGET
            if [ "$TARGET" = "main" ]; then tag=beta; fi
            suffix=$tag
          fi
          echo "Validated target='$TARGET' as kind=$kind"
          {
            echo "kind=$kind"
            echo "ref=${ref:-}"
            echo "tag=${tag:-}"
            echo "suffix=${suffix:-}"
          } >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: [pre-run, validate-dispatch]
    environment: npm
    permissions:
      contents: write # push git tags + create GitHub Releases
      id-token: write # npm OIDC trusted publishing
    # `!failure() && !cancelled()` lets this job run when `validate-dispatch`
    # is `skipped` (push trigger), but still blocks on a real failure of
    # `pre-run` or `validate-dispatch`. `ref_name == 'main'` keeps manual
    # dispatches from accidentally publishing `latest` from a stale branch.
    if: "!failure() && !cancelled() && needs.pre-run.outputs.is-not-fork == 'true' && github.ref_name == 'main' && ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: version packages')) || (github.event_name == 'workflow_dispatch' && needs.validate-dispatch.outputs.kind == 'release'))"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - run: npm ci

      # `npm run release` runs `npm run build && changeset publish`. We use
      # changesets/action only as the publish runner — it pushes the per-package
      # git tags that `changeset publish` creates locally and opens a GitHub
      # Release per package. No `version:` input: version bumps happen in
      # `version.yml`, never here. NPM_CONFIG_IGNORE_SCRIPTS skips each
      # package's prepublishOnly hook (avoids duplicate test/build work and the
      # partial-publish failure mode we hit on 2026-05-22).
      - name: Publish
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'

  # Code from the target ref must not run in a job that can get an npm token.
  # Thus this job builds the packages without `id-token`, and `publish-preview`
  # publishes them without a checkout.
  build:
    runs-on: ubuntu-latest
    needs: [pre-run, validate-dispatch]
    if: "needs.pre-run.outputs.is-not-fork == 'true' && (needs.validate-dispatch.outputs.kind == 'snapshot' || needs.validate-dispatch.outputs.kind == 'pr')"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-dispatch.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - run: npm ci

      - name: Seed dummy changeset if none present
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -vqi readme; then
            cat > .changeset/__snapshot.md <<'EOF'
          ---
          "@stacks/common": patch
          ---

          snapshot
          EOF
          fi

      - run: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set snapshot version
        env:
          TAG: ${{ needs.validate-dispatch.outputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TAG" = "pr" ]; then
            node .github/scripts/snapshot-version.mjs pr --pr "$TARGET"
          else
            node .github/scripts/snapshot-version.mjs "$TAG"
          fi

      - run: npm run build

      - name: Pack public packages
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in packages/*/; do
            if [ ! -f "$dir/package.json" ]; then continue; fi
            if [ "$(jq -r '.private // false' "$dir/package.json")" = "true" ]; then continue; fi
            (cd "$dir" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/tarballs")
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-preview:
    runs-on: ubuntu-latest
    needs: [validate-dispatch, build]
    environment: npm
    permissions:
      id-token: write # npm OIDC trusted publishing
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs

      # Code from the target ref made these tarballs. Do not trust their
      # contents: examine each one before the first publish.
      # Skip the versions that are already on npm. A re-run can then complete
      # a partial publish.
      - id: publish
        env:
          TAG: ${{ needs.validate-dispatch.outputs.tag }}
          SUFFIX: ${{ needs.validate-dispatch.outputs.suffix }}
          REF: ${{ needs.validate-dispatch.outputs.ref }}
        run: |
          set -euo pipefail
          name_re='^@stacks/[a-z0-9-]+$'
          version_re="^[0-9]+\\.[0-9]+\\.[0-9]+-${SUFFIX//./\\.}\\.[0-9]+\$"

          shopt -s nullglob
          files=(tarballs/*.tgz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no tarballs to publish"
            exit 1
          fi

          names=()
          version=''
          for f in "${files[@]}"; do
            meta=$(tar -xzOf "$f" package/package.json)
            name=$(jq -r '.name' <<<"$meta")
            v=$(jq -r '.version' <<<"$meta")
            registry=$(jq -r '.publishConfig.registry // ""' <<<"$meta")
            if [[ ! "$name" =~ $name_re ]] || [[ ! "$v" =~ $version_re ]] || [ "$v" != "${version:-$v}" ] || [ -n "$registry" ]; then
              echo "::error::$f: unexpected package '$name@$v' (registry '$registry')"
              exit 1
            fi
            names+=("$name")
            version=$v
          done

          # Provenance records the commit of this run, which is on `main`. That
          # is the wrong source for a build of a different ref.
          provenance=true
          if [ "$REF" != "main" ]; then provenance=false; fi

          for i in "${!files[@]}"; do
            if [ -n "$(npm view "${names[$i]}@$version" version 2>/dev/null || true)" ]; then
              echo "${names[$i]}@$version is already published; skipping"
              continue
            fi
            npm publish "${files[$i]}" --tag "$TAG" --access public --ignore-scripts --provenance="$provenance"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A different job, because this action must not run with `id-token`.
  pr-header:
    runs-on: ubuntu-latest
    needs: [validate-dispatch, publish-preview]
    if: "needs.validate-dispatch.outputs.kind == 'pr'"
    permissions:
      pull-requests: write # update PR sticky header
    steps:
      - name: Update PR sticky header
        uses: janniks/pull-request-fixed-header@f41837c1d1cee46efb1481db5b6045748202ff09 # v1.3.0
        with:
          header: |
            > This PR was published to npm with the version `${{ needs.publish-preview.outputs.version }}` (dist-tag `pr`), built from ${{ needs.validate-dispatch.outputs.ref }}.
            > e.g. `npm install @stacks/common@${{ needs.publish-preview.outputs.version }} --save-exact`
          pr-number: ${{ inputs.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
